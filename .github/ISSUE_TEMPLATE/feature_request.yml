name: Feature request
description: Suggest an improvement or a new kind of preview
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or annoyance behind the idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (screenshots, examples, links)
